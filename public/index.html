<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Brawl Stars Draft Coach</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Lilita One & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #080c14;
            color: #f8fafc;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        .brawl-stroke {
            text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .touch-btn { transition: transform 0.08s ease, filter 0.08s ease; }
        .touch-btn:active { transform: scale(0.94); filter: brightness(1.2); }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(234, 179, 8, 0.4); }
            50% { box-shadow: 0 0 20px rgba(234, 179, 8, 0.8); }
        }
        .glow-counter { animation: pulse-glow 2s infinite; }
    </style>
</head>
<body class="pb-10 max-w-md md:max-w-3xl lg:max-w-6xl mx-auto min-h-screen flex flex-col border-x border-slate-800/50 shadow-2xl">

    <!-- STICKY TOP DRAFT BAR -->
    <header class="sticky top-0 z-50 bg-slate-900/95 border-b border-slate-800 backdrop-blur-md px-3 py-2.5 shadow-xl">
        <div class="flex items-center justify-between gap-2 mb-2">
            <div class="flex items-center gap-1.5">
                <span class="w-6 h-6 bg-amber-400 text-slate-950 rounded-lg flex items-center justify-center font-brawl text-xs shadow">
                    <i class="fa-solid fa-chess-knight"></i>
                </span>
                <h1 class="font-brawl text-lg text-amber-400 tracking-wide brawl-stroke">DRAFT COACH</h1>
                <a href="./guide.html" target="_blank" class="touch-btn text-[10px] font-brawl text-cyan-300 border border-cyan-400/40 rounded-lg px-2 py-1 hover:bg-cyan-400/10 shrink-0">&#63; GUIDE</a>
                <a href="./matrix.html" target="_blank" class="touch-btn text-[10px] font-brawl text-amber-300 border border-amber-400/40 rounded-lg px-2 py-1 hover:bg-amber-400/10 shrink-0">&#9883; MATRIX</a>
                <a href="./strategy-diff.html" target="_blank" class="touch-btn text-[10px] font-brawl text-red-300 border border-red-400/40 rounded-lg px-2 py-1 hover:bg-red-400/10 shrink-0">&#9654; DIFF</a>
            </div>
            <button onclick="resetAll()" class="touch-btn text-[10px] bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold px-2.5 py-1 rounded-lg border border-slate-700 flex items-center gap-1 uppercase tracking-wider">
                <i class="fa-solid fa-rotate-right text-amber-400"></i> Reset
            </button>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-2">
            <select id="modeSelect" onchange="onModeChange()" class="w-full bg-slate-950 border border-slate-700 text-xs text-amber-300 font-bold py-1.5 px-2 rounded-xl focus:outline-none focus:border-amber-400"></select>
            <select id="mapSelect" onchange="onMapChange()" class="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 font-semibold py-1.5 px-2 rounded-xl focus:outline-none focus:border-amber-400"></select>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-2">
            <select id="slotSelect" onchange="onSlotChange()" class="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 font-semibold py-1.5 px-2 rounded-xl focus:outline-none focus:border-amber-400">
                <option value="1">PICK 1 (first lock)</option>
                <option value="23">PICK 2/3 (mid draft)</option>
                <option value="45">PICK 4-5 (last picks)</option>
            </select>
            <select id="coinSelect" onchange="onCoinChange()" class="w-full bg-slate-950 border border-slate-700 text-xs text-slate-200 font-semibold py-1.5 px-2 rounded-xl focus:outline-none focus:border-amber-400">
                <option value="lose">🪙 Opponent picks first</option>
                <option value="win">🪙 We pick first</option>
            </select>
        </div>

        <div class="flex justify-end">
            <span id="metaBadge" class="text-[9px] font-bold px-2 py-1 rounded-full uppercase border whitespace-nowrap"></span>
        </div>
    </header>

    <main class="flex-1 px-3 pt-3 space-y-3 md:px-5">


        <!-- Laptop: left column = score table + intel · right column = brawler selection -->
        <div class="lg:grid lg:grid-cols-2 lg:gap-5 lg:items-start">

            <div class="space-y-3 min-w-0">
        <!-- DRAFT BOARD: merged card — bans strip + blue/red arena + odds pill + lane matchups (one card, Prodigy-style) -->
        <section class="bg-slate-900/95 border-2 border-purple-500/40 rounded-2xl p-3 shadow-xl">
            <div class="flex items-center justify-between gap-2 mb-2 px-0.5">
                <button id="targetYou" onclick="setTarget('you')" class="target-btn touch-btn text-[9px] font-bold px-2.5 py-1 rounded-lg border uppercase tracking-wider">Pick Blue</button>
                <span class="font-brawl text-purple-300 text-xs tracking-wider brawl-stroke"><i class="fa-solid fa-scale-balanced text-purple-400 mr-1"></i>DRAFT BOARD</span>
                <button id="targetEnemy" onclick="setTarget('enemy')" class="target-btn touch-btn text-[9px] font-bold px-2.5 py-1 rounded-lg border uppercase tracking-wider">Pick Red</button>
            </div>

            <div class="relative rounded-2xl overflow-hidden border border-slate-700/70">
                <div class="absolute inset-0 grid grid-cols-2">
                    <div class="bg-gradient-to-b from-blue-700/50 via-blue-800/25 to-slate-900/10 border-r-4 border-slate-900/70"></div>
                    <div class="bg-gradient-to-b from-red-700/50 via-red-800/25 to-slate-900/10"></div>
                </div>
                <div id="vsOdds" class="absolute top-2 left-1/2 -translate-x-1/2 z-10 font-brawl text-sm px-4 py-1.5 rounded-full shadow-lg whitespace-nowrap"></div>
                <div class="relative grid grid-cols-2 pt-11 pb-9 px-2">
                    <div class="flex flex-col items-center gap-2" id="arenaYours"></div>
                    <div class="flex flex-col items-center gap-2" id="arenaFoes"></div>
                </div>
                <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 font-brawl text-3xl text-white brawl-stroke pointer-events-none drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">VS</div>
                <div class="absolute bottom-2 left-1/2 -translate-x-1/2 flex items-center gap-1.5" id="arenaBans"></div>
            </div>

            <div class="flex items-center justify-between gap-2 mt-2.5 mb-1.5">
                <button id="targetBan" onclick="setTarget('ban')" class="target-btn touch-btn text-[9px] font-bold px-2.5 py-1 rounded-lg border uppercase tracking-wider bg-slate-800 text-slate-400 border-slate-700">Ban</button>
                <span class="text-[9px] text-slate-500 italic text-right">Engine estimate — counter pairs, class geometry, mode &amp; map weighting.</span>
            </div>
            <div class="grid grid-cols-3 gap-2" id="vsLanes"></div>
            <details class="mt-2">
                <summary class="text-[9px] font-bold text-slate-400 uppercase tracking-wider cursor-pointer select-none">Recommended bans ▾</summary>
                <div id="banList" class="space-y-1.5 mt-1.5"></div>
            </details>
        </section>

                <!-- TOP RECOMMENDATIONS (score table — always visible while drafting) -->
        <section class="bg-slate-900/95 border-2 border-amber-400/80 rounded-2xl p-3 shadow-xl relative overflow-hidden">
            <div class="flex items-center justify-between mb-2">
                <div class="flex items-center gap-1.5">
                    <i class="fa-solid fa-bolt text-amber-400 text-sm"></i>
                    <h2 class="font-brawl text-amber-400 text-sm tracking-wide brawl-stroke">SCORE</h2>
                </div>
                <span id="ruleHint" class="text-[9px] font-bold bg-amber-400/20 text-amber-300 px-2 py-0.5 rounded-full uppercase border border-amber-400/30 text-center"></span>
            </div>
            <div id="recommendationsList" class="space-y-1.5"></div>
        </section>

        <!-- Standalone VS BOARD removed — merged into the DRAFT BOARD card above -->

                <!-- DRAFT INTEL -->
                <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-2.5 shadow-lg space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <div class="text-[9px] font-bold text-green-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-hand-fist"></i> In Your Hand</div>
                    <div id="counterList" class="space-y-1 text-[10px] text-slate-300"></div>
                </div>
                <div>
                    <div class="text-[9px] font-bold text-red-400 uppercase tracking-wider mb-1"><i class="fa-solid fa-triangle-exclamation"></i> Watch Out</div>
                    <div id="threatList" class="space-y-1 text-[10px] text-slate-300"></div>
                </div>
            </div>
        </section>

            </div><!-- /left column -->

            <div class="space-y-3 min-w-0">

                <!-- BRAWLER SELECTION GRID BY DRAFT CLASS -->
                <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-2.5 shadow-lg space-y-2.5">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input type="text" id="brawlerSearch" placeholder="Search brawlers..."
                       class="w-full bg-slate-950 border border-slate-700/80 rounded-xl py-1.5 pl-8 pr-3 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400">
            </div>

            <!-- Class Tabs -->
            <div class="flex gap-1 flex-wrap justify-center pb-0.5 text-[10px] font-bold" id="classTabs"></div>

            <!-- Trait Legend -->
            <div class="flex items-center gap-2 flex-wrap text-[9px] font-bold text-slate-400">
                <span>⭐ <span class="text-amber-400">Good Hyper</span></span>
                <span>=J <span class="text-red-400">Knockback/Stun</span></span>
                <span>🧱 <span class="text-green-400">Wall Break</span></span>
                <span>➶ <span class="text-indigo-400">Pierce Damage</span></span>
                <span>⚙️ <span class="text-cyan-400">Support</span></span>
            </div>

            <div id="brawlersGrid" class="space-y-3"></div>
        </section>

            </div><!-- /right column -->
        </div><!-- /responsive columns -->
    </main>

                    ${ICONS[b.id] ? `<img src="${ICONS[b.id]}" alt="${b.name}" class="absolute inset-0 w-full h-full object-cover" onerror="this.remove()">` : ''}
                    <span onclick="event.stopPropagation(); clearSlot('${zone}',${idx})" class="absolute -top-1 -right-1 bg-${zone === 'you' ? 'blue' : 'red'}-500 text-white w-4 h-4 rounded-full text-[9px] font-bold flex items-center justify-center shadow z-10">×</span>
                </button>`;
            }
            return `
                <button onclick="focusSlot('${zone}',${idx})" title="Tap to set slot ${idx + 1}" class="touch-btn w-14 h-14 rounded-xl border-2 border-dashed flex items-center justify-center ${zone === 'you'
                    ? (focused ? 'border-blue-300 bg-blue-400/25 text-blue-200' : 'border-blue-400/40 text-blue-200/40')
                    : (focused ? 'border-red-300 bg-red-400/25 text-red-200' : 'border-red-400/40 text-red-200/40')}">
                    <i class="fa-solid fa-plus text-sm"></i>
                </button>`;
        }

        function renderSlots() {
            const yc = document.getElementById('arenaYours');
            const ec = document.getElementById('arenaFoes');
            if (yc) yc.innerHTML = state.yourPicks.map((p, i) => slotHTML(p, i, 'you')).join('');
            if (ec) ec.innerHTML = state.enemyPicks.map((p, i) => slotHTML(p, i, 'enemy')).join('');
        }

        function focusSlot(zone, idx) {
            state.target = zone;
            state.focus = `${zone}${idx}`;
            renderTargetButtons();
            renderSlots();
        }

        function clearSlot(zone, idx) {
            if (zone === 'ban') {
                state.bans[idx] = null;
                state.target = 'ban';
            } else {
                state[zone === 'you' ? 'yourPicks' : 'enemyPicks'][idx] = null;
            }
            recompute();
        }

        function cycleSlot(zone, idx) {
            // tap a filled slot to select it (then next pick replaces it)
            state.target = zone;
            state.focus = `${zone}${idx}`;
            renderTargetButtons();
            renderSlots();
        }

        function pickBrawler(brawlerId) {
            const zone = state.target;
            if (zone === 'ban') {
                if (state.bans.includes(brawlerId)) return;
                let idx = state.focus && state.focus.startsWith('ban') ? parseInt(state.focus.slice(3), 10) : -1;
                if (idx === -1) idx = state.bans.findIndex(p => p === null);
                if (idx === -1) return; // all 6 ban slots used
                state.bans[idx] = brawlerId;
                state.focus = null;
                const nxt = state.bans.findIndex(p => p === null);
                if (nxt !== -1) { state.focus = `ban${nxt}`; }
                recompute();
                return;
            }
            const key = zone === 'you' ? 'yourPicks' : 'enemyPicks';
            if (state.bans.includes(brawlerId) || state.yourPicks.includes(brawlerId) || state.enemyPicks.includes(brawlerId)) return;
            let slotIdx = -1;
            if (state.focus && state.focus.startsWith(zone)) {
                slotIdx = parseInt(state.focus.slice(zone.length), 10);
            } else {
                slotIdx = state[key].findIndex(p => p === null);
            }
            if (slotIdx === -1) return; // team full
            state[key][slotIdx] = brawlerId;
            state.focus = null;
            // advance to next empty slot on same team
            const nxt = state[key].findIndex(p => p === null);
            if (nxt !== -1) { state.focus = `${zone}${nxt}`; }
            recompute();
        }

        function setClassFilter(cls) {
            state.classFilter = cls;
            renderClassTabs();
            renderBrawlers();
        }

        function renderClassTabs() {
            // Cheat-sheet left-to-right group order
            const order = ['ALL', 'THROWER', 'TANK', 'SPACE_MAKER', 'ANTI_TANK', 'SUPPORT', 'SNIPER', 'CONTROL'];
            const counts = {};
            BRAWLERS.forEach(b => counts[b.cls] = (counts[b.cls] || 0) + 1);
            const el = document.getElementById('classTabs');
            el.innerHTML = order.map(key => {
                const isActive = state.classFilter === key;
                const hex = key === 'ALL' ? '#fbbf24' : CLASS_META[key].hex;
                const label = key === 'ALL' ? 'ALL' : CLASS_META[key].label.toUpperCase();
                const count = key === 'ALL' ? BRAWLERS.length : counts[key] || 0;
                return `<button onclick="setClassFilter('${key}')" class="rarity-tab touch-btn px-2.5 py-1 rounded-lg whitespace-nowrap border ${isActive ? 'border-amber-400' : 'border-slate-800 bg-slate-800'}" style="color:${hex}">${label} (${count})</button>`;
            }).join('');
        }

        function renderBrawlers() {
            const container = document.getElementById('brawlersGrid');
            const taken = new Set([...state.yourPicks, ...state.enemyPicks, ...state.bans].filter(Boolean));
            const filtered = BRAWLERS.filter(b => {
                const matchesClass = state.classFilter === 'ALL' || b.cls === state.classFilter;
                const matchesSearch = b.name.toLowerCase().includes(state.searchQuery);
                return matchesClass && matchesSearch;
            });
            const classOrder = ['THROWER', 'TANK', 'SPACE_MAKER', 'ANTI_TANK', 'SUPPORT', 'SNIPER', 'CONTROL'];
            let html = '';
            classOrder.forEach(clsKey => {
                const group = filtered.filter(b => b.cls === clsKey);
                if (!group.length) return;
                const meta = CLASS_META[clsKey];
                html += `
                <div>
                    <div class="text-[10px] font-brawl tracking-wider uppercase mb-1 flex items-center gap-1" style="color:${meta.hex}">
                        <span class="w-1.5 h-1.5 rounded-full" style="background:${meta.hex}"></span>
                        ${meta.label} (${group.length})
                    </div>
                    <div class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-10 gap-1">
                        ${group.map(b => {
                            const isTaken = taken.has(b.id);
                            const mm = CLASS_META[b.cls];
                            const traits = (b.traits || []).filter(t => TRAIT_META[t])
                                .map(t => `<span title="${TRAIT_META[t].label}" class="w-1.5 h-1.5 rounded-full" style="background:${TRAIT_META[t].hex}"></span>`).join('');
                            return `
                            <button onclick="pickBrawler('${b.id}')" ${isTaken ? 'disabled' : ''}
                                    class="touch-btn p-1.5 rounded-xl bg-slate-950 border flex flex-col items-center justify-center relative ${isTaken ? 'opacity-25' : 'hover:scale-105'}" style="border-color:${mm.hex}66">
                                ${BUFFIES.has(b.id) ? '<span title="Buffie upgrades: Gadget / Star Power / Hypercharge boosts" class="absolute -top-1 -right-0.5 text-[10px] leading-none">🧪</span>' : ''}
                                ${avatarHTML(b, 'w-7 h-7')}
                                <span class="text-[9px] font-bold text-slate-200 truncate w-full text-center mt-0.5">${b.name}</span>
                                <div class="flex gap-0.5 mt-0.5 h-1.5">${traits}</div>
                            </button>`;
                        }).join('')}
                    </div>
                </div>`;
            });
            container.innerHTML = html || `<div class="text-xs text-slate-500 text-center py-4">No brawlers found</div>`;
        }

        // ============ BAN ENGINE (Part 2: coin-flip-based ban rules) ============
        function banPicks() {
            const g = GAMEMODES.find(m => m.id === state.mode);
            const aggro = g.meta === 'AGGRO';
            const pool = BRAWLERS.filter(b => !state.yourPicks.includes(b.id) && !state.enemyPicks.includes(b.id) && !state.bans.includes(b.id));
            const meta = pool.filter(b => META5.has(b.id));
            let ordered = [];

            if (state.coin === 'lose') {
                // Opponent has first pick: ban their three best first-pick brawlers on the map.
                // Video update: aggro bans should also cover meta divers (Kaze/Shade class), not only anti-tanks.
                if (aggro) {
                    ordered = meta.filter(b => b.cls === 'ANTI_TANK' || b.cls === 'SPACE_MAKER')
                        .map(b => ({ b, why: 'Their first pick: dominant meta anti-tank or diver' }));
                } else {
                    ordered = meta.filter(b => b.cls === 'CONTROL' || (b.cls === 'SNIPER' && b.sub === 'UTILITY'))
                        .map(b => ({ b, why: 'Their first pick: passive-mode meta mainstay' }));
                }
            } else {
                // We have first pick: NEVER ban top meta anti-tanks — that hands them the best pick.
                const pivots = aggro
                    ? meta.filter(b => b.cls === 'CONTROL' || b.cls === 'SPACE_MAKER')
                    : meta.filter(b => (b.cls === 'SNIPER' && b.sub === 'UTILITY') || b.cls === 'CONTROL');
                const cheese = meta.filter(b => b.cls === 'THROWER' || b.id === 'shade');
                // Rule: ban one strong 2/3 pivot + the dangerous last-pick cheese first.
                ordered = pivots.map(b => ({ b, why: 'Strong 2/3 pivot that rounds out their comps' }))
                    .concat(cheese.map(b => ({ b, why: 'Dangerous last-pick cheese' })))
                    .filter(p => p.b.cls !== 'ANTI_TANK');
            }

            const seen = new Set();
            const out = [];
            ordered.forEach(p => {
                if (!seen.has(p.b.id) && out.length < 3) { seen.add(p.b.id); out.push(p); }
            });
            return out;
        }

        // ============ VS BOARD (odds + lane matchups — our engine, Prodigy-style layout) ============
        function laneMatchup(y, e, g) {
            if (!y || !e) return { pct: 50, why: '' };
            let pct = 50;
            const why = [];
            if (y.counters && y.counters[e.id]) { pct += 12; why.push(`${y.name} beats ${e.name}: ${y.counters[e.id]}`); }
            if (e.counters && e.counters[y.id]) { pct -= 12; why.push(`${e.name} beats ${y.name}: ${e.counters[y.id]}`); }
            const my = y.modes || CLASS_MODES[y.cls];
            const em = e.modes || CLASS_MODES[e.cls];
            if (my.includes(g.id)) pct += 3; else pct -= 2;
            if (em.includes(g.id)) pct -= 3; else pct += 2;
            if (y.cls === 'ANTI_TANK' && (e.cls === 'SPACE_MAKER' || e.cls === 'TANK')) { pct += 7; why.push('Anti-tank answers their aggression'); }
            if (y.cls === 'THROWER' && (e.cls === 'SPACE_MAKER' || e.cls === 'TANK')) { pct -= 7; why.push('Their mobility punishes your thrower'); }
            if (y.cls === 'SNIPER' && y.sub === 'PURE' && e.cls === 'SPACE_MAKER') { pct -= 8; why.push('Pure sniper loses the dive war'); }
            if (e.cls === 'SNIPER' && e.sub === 'PURE' && y.cls === 'SPACE_MAKER') { pct += 8; why.push('Your dive hunts their sniper'); }
            const mapm = MAP_META[state.map] || { geo: 'MIXED' };
            if (mapm.geo === 'OPEN') {
                if (y.cls === 'SNIPER') pct += 3;
                if (e.cls === 'SNIPER') pct -= 2;
                if (y.cls === 'THROWER') pct -= 2;
            } else if (mapm.geo === 'CLOSED' || mapm.geo === 'BUSHY') {
                if (y.cls === 'SPACE_MAKER') pct += 3;
                if (e.cls === 'SPACE_MAKER') pct -= 3;
            }
            return { pct: Math.max(28, Math.min(74, Math.round(pct))), why: why.join(' • ') };
        }

        function renderVsBoard() {
            const g = GAMEMODES.find(m => m.id === state.mode);
            const y = state.yourPicks.map(byId);
            const e = state.enemyPicks.map(byId);
            const oddsEl = document.getElementById('vsOdds');
            const lanes = [{ label: 'SIDE', i: 0 }, { label: 'MID', i: 1 }, { label: 'SIDE', i: 2 }];
            const taken = new Set([...state.yourPicks, ...state.enemyPicks, ...state.bans].filter(Boolean));
            // Best available counter-pick for an empty lane facing a locked enemy slot
            const bestFor = e => {
                let best = null, why = '', bestPct = -1;
                BRAWLERS.forEach(b => {
                    if (taken.has(b.id)) return;
                    const m = laneMatchup(b, e, g);
                    const p = m.pct + (BUFFIES.has(b.id) ? 2 : 0);
                    if (p > bestPct) { best = b; why = m.why; bestPct = p; }
                });
                return best ? { b: best, why } : null;
            };
            const mini = (b, tone) => {
                if (b) return avatarHTML(b, 'w-10 h-10');
                if (tone === 'suggest') {
                    return '<div class="w-10 h-10 rounded-lg ring-2 ring-amber-400 flex items-center justify-center text-amber-300 text-[8px] font-brawl">STAR</div>';
                }
                return `<div class="w-10 h-10 rounded-lg ${tone === 'you' ? 'bg-blue-900/40 border border-blue-500/40' : 'bg-red-900/40 border border-red-500/40'} flex items-center justify-center text-slate-600 text-[9px] font-brawl">TBD</div>`;
            };
            const chip = ['bg-blue-500/25 text-blue-200 border-blue-400/50', 'bg-amber-500/25 text-amber-200 border-amber-400/50', 'bg-violet-500/25 text-violet-200 border-violet-400/50'];
            document.getElementById('vsLanes').innerHTML = lanes.map((L, li) => {
                const yy = y[L.i], ee = e[L.i];
                const decided = !!(yy && ee);
                const best = (!yy && ee) ? bestFor(ee) : null;
                const m = laneMatchup(yy, ee, g);
                const tone = decided ? (m.pct >= 56 ? 'good' : m.pct <= 44 ? 'bad' : 'mid') : null;
                const badgeBorder = tone === 'good' ? 'border-green-400' : tone === 'bad' ? 'border-red-400' : tone === 'mid' ? 'border-amber-400' : 'border-slate-600';
                const badgeText = tone === 'good' ? 'text-green-300' : tone === 'bad' ? 'text-red-300' : tone === 'mid' ? 'text-amber-200' : 'text-slate-500';
                const names = decided ? `${yy.name} vs ${ee.name}` : (ee ? `vs ${ee.name}` : (yy ? yy.name : 'open lane'));
                return `<div class="bg-slate-950/70 rounded-xl p-2 flex flex-col items-center gap-1.5" title="${((decided ? m.why : '') || (best && best.why) || '').replace(/"/g, '&quot;')}">
                    <span class="self-start text-[8px] font-bold px-1.5 py-0.5 rounded-full border ${chip[li]}">${L.label}</span>
                    ${best && !yy ? `<div class="relative" title="Suggested: ${best.b.name}${best.why ? ' — ' + best.why : ''}">${best.b ? mini(best.b) : ''}</div>` : mini(yy, 'you')}
                    <div class="w-14 h-14 rounded-full border-2 ${badgeBorder} flex flex-col items-center justify-center leading-none">
                        <span class="font-brawl text-[13px] ${badgeText}">${decided ? m.pct + '%' : (best ? '★' : '—')}</span>
                        <span class="text-[7px] text-slate-500">VS</span>
                    </div>
                    ${mini(ee, 'foe')}
                    <span class="text-[8px] font-bold ${best ? 'text-amber-300' : 'text-slate-400'} truncate w-full text-center">${best ? '★ ' + best.b.name : names}</span>
                </div>`;
            }).join('');
            const allLocked = y.every(Boolean) && e.every(Boolean);
            const lockedCount = y.filter(Boolean).length + e.filter(Boolean).length;
            if (!allLocked) {
                oddsEl.textContent = `${lockedCount}/6 locked`;
                oddsEl.className = 'font-brawl text-sm px-4 py-1.5 rounded-full shadow-lg whitespace-nowrap bg-slate-800/90 text-slate-300 border border-slate-600';
                return;
            }
            const decidedLanes = lanes.filter(L => y[L.i] && e[L.i]);
            const odds = Math.round(decidedLanes.reduce((s, L) => s + laneMatchup(y[L.i], e[L.i], g).pct, 0) / decidedLanes.length);
            oddsEl.textContent = `Odds of winning: ${odds}%`;
            oddsEl.className = 'font-brawl text-sm px-4 py-1.5 rounded-full shadow-lg whitespace-nowrap bg-amber-400 text-slate-950 border border-amber-300';
        }

        function renderBanSlots() {
            const el = document.getElementById('arenaBans');
            if (!el) return;
            el.innerHTML = state.bans.map((id, i) => {
                const b = id ? byId(id) : null;
                if (b) {
                    // Grey ban chip: grayscale portrait over a slate base, Prodigy-style ban strip
                    return `<button onclick="clearSlot('ban',${i})" class="touch-btn relative w-9 h-9 rounded-lg overflow-hidden border border-slate-300/70 shadow" title="Banned: ${b.name} — tap to un-ban">
                        <div class="relative w-full h-full rounded-md overflow-hidden" style="background:#64748b">
                            ${ICONS[b.id] ? `<img src="${ICONS[b.id]}" alt="${b.name}" class="absolute inset-0 w-full h-full object-cover grayscale" onerror="this.remove()">` : ''}
                            <span class="absolute inset-0 bg-slate-900/40 pointer-events-none"></span>
                        </div>
                        <span class="absolute -top-1 -right-1 bg-slate-500 text-white w-3.5 h-3.5 rounded-full shadow">×</span>
                    </button>`;
                }
                return `<button onclick="focusSlot('ban',${i})" title="Ban slot ${i + 1}" class="touch-btn w-9 h-9 rounded-lg border border-dashed ${state.focus === 'ban' + i ? 'border-slate-300 bg-slate-400/10 text-slate-300' : 'border-slate-500/60 bg-slate-900/70'} flex items-center justify-center text-slate-500 font-brawl text-[10px]">${i + 1}</button>`;
            }).join('');
        }

        function renderBans() {            const el = document.getElementById('banList');
            const picks = banPicks();
            if (!picks.length) {
                el.innerHTML = '<div class="text-[10px] text-slate-500">No meta ban targets available for this setup.</div>';
                return;
            }
            const tag = why => why.indexOf('Strong 2/3') === 0 ? '2/3 PIVOT'
                : why.indexOf('Dangerous') === 0 ? 'LAST-PICK CHEESE'
                : why.indexOf('dominant') !== -1 ? 'FIRST-PICK THREAT (aggro)' : 'FIRST-PICK THREAT (passive)';
            el.innerHTML = picks.map(p => {
                const mm = CLASS_META[p.b.cls];
                return `<div class="bg-slate-950 p-1.5 rounded-xl border border-slate-600/60 flex items-center gap-2">
                    ${avatarHTML(p.b, 'w-6 h-6 shrink-0')}
                    <div class="min-w-0">
                        <span class="font-brawl text-[11px] text-slate-200">${p.b.name}</span>
                        <span class="text-[8px] font-bold px-1 rounded bg-slate-400/20 text-slate-300 ml-1 uppercase">${tag(p.why)}</span>
                        <div class="text-[9px] text-slate-400">${p.why}</div>
                    </div>
                </div>`;
            }).join('');
        }

        // ============ DRAFT ENGINE (rules from Bobby's draft guide) ============
        function recompute() {
            renderSlots();
            renderBrawlers();
            renderMetaBadge();
            renderVsBoard();
            renderBanSlots();
            renderBans();
            updateAdvice();
        }

        function classCounts(list) {
            const c = {};
            list.forEach(b => c[b.cls] = (c[b.cls] || 0) + 1);
            return c;
        }

        function recommend() {
            const g = GAMEMODES.find(m => m.id === state.mode);
            const aggro = g.meta === 'AGGRO';
            const band = state.slot;
            const enemies = state.enemyPicks.filter(Boolean).map(byId);
            const yours = state.yourPicks.filter(Boolean).map(byId);
            const ec = classCounts(enemies);
            const yc = classCounts(yours);
            const taken = new Set([...state.yourPicks, ...state.enemyPicks, ...state.bans].filter(Boolean));
            const healers = enemies.filter(e => e.cls === 'SUPPORT' || (e.cls === 'SNIPER' && e.sub === 'UTILITY')).length;
            const mapm = MAP_META[state.map] || { geo: 'MIXED', edge: [] };
            const recs = [];

            BRAWLERS.forEach(b => {
                if (taken.has(b.id)) return;
                let score = 0, reasons = [], warns = [];
                const add = (pts, why) => { score += pts; if (why && reasons.length < 4) reasons.push(why); };
                const bad = (pts, why) => { score += pts; warns.push(why); };
                if (BUFFIES.has(b.id)) add(5, 'Buffie-upgraded kit');

                if (aggro) {
                    if (band === '1') {
                        // Open map — range keeps the anti-tank monopoly from being automatic
                        const atFirst = (mapm.geo === 'OPEN') ? 82 : 100;
                        if (b.cls === 'ANTI_TANK') add(atFirst, 'Best first pick: anti-tanks are the safest lock in aggressive modes');
                        else if (b.cls === 'CONTROL') add(15, ' playable, but an anti-tank is usually the safer first lock');
                    } else if (band === '23') {
                        if (!ec['ANTI_TANK'] && b.cls === 'SPACE_MAKER') add(80, 'Enemy has no anti-tank yet — space makers punish that hard');
                        if (b.cls === 'ANTI_TANK') add(55, 'Solid: secures your anti-tank answer');
                        if (ec['TANK'] && b.cls === 'ANTI_TANK') add(25, 'Directly handles their tank pick');
                    } else {
                        // Dive their backline ONLY when their whole comp is passive — if they run their own dive threat, you need answers instead (Nita/Maisie quiz)
                        if (!ec['ANTI_TANK'] && !ec['SPACE_MAKER'] && !ec['TANK']) {
                            if (b.cls === 'SPACE_MAKER') add(85, 'Enemy comp is fully passive — dive their backline');
                            if (b.cls === 'TANK') add(65, 'No enemy anti-tank in sight: high-HP tanks out-value');
                        }
                        if ((ec['SPACE_MAKER'] || ec['TANK']) && b.cls === 'ANTI_TANK') add(85, 'Shut down their aggressive picks');
                        if (ec['SNIPER'] || ec['THROWER']) {
                            if (b.cls === 'SPACE_MAKER') {
                                // Video: when their comp is screened by 2+ anti-tanks, dive value drops — prefer lob range (Heist quiz)
                                if ((ec['ANTI_TANK'] || 0) >= 2) add(20, 'Their anti-tank screen catches divers — think ranged instead');
                                else add(80, 'Punish their passive sniper/thrower picks');
                            }
                        }
                        // Heist object race: against a ground-bound comp, lobbed range melts the safe for free (Dyna > Barley quiz)
                        if (state.mode === 'heist' && b.cls === 'THROWER' && !ec['SPACE_MAKER'] && !ec['TANK']) add(55, 'Heist object race: lobbed damage melts the safe');
                    }
                    if (state.mode === 'heist' && (b.traits || []).includes('HYPER')) add(20, 'Heist: high-impact hypercharge = safe damage on the safe');
                } else { // PASSIVE: Knockout & Bounty
                    if (band === '1') {
                        if (b.cls === 'SNIPER') {
                            if (b.sub === 'UTILITY') add(60, 'Utility snipers are the safest first picks in passive modes');
                            else bad(-15, 'Pure snipers struggle into space makers — better saved for last');
                        }
                        if (b.cls === 'CONTROL') add(50, 'Well-rounded control holds lanes without dying to aggro');
                        if (b.cls === 'ANTI_TANK') add(30, 'Decent here, even better in aggressive modes');
                        if (b.cls === 'THROWER') bad(-80, 'Never first-pick throwers');
                        if (b.cls === 'SPACE_MAKER') bad(-30, 'Aggressive picks get focused in passive modes');
                    } else if (band === '23') {
                        if (b.cls === 'SNIPER' && b.sub === 'UTILITY') add(45, 'High-value utility for the mid draft');
                        if (b.cls === 'CONTROL') add(40, 'Great mid-draft control pick');
                        if (b.cls === 'ANTI_TANK') add(35, 'Keeps your flex options open');
                        if ((b.traits || []).includes('HYPER')) add(20, 'High-impact hypercharge adds mid-draft value');
                    } else { // last picks
                        if (!ec['SPACE_MAKER'] && !ec['ANTI_TANK'] && b.cls === 'THROWER') add(85, 'Counter-pick: enemy lacks anti-aggro — throwers take over the map');
                        if (healers >= 2 && b.cls === 'TANK') add(45, 'Double sustain comp — you need real kill pressure (Fang over chip damage)');
                        if (enemies.filter(e => e.cls === 'SNIPER' && e.sub === 'PURE').length >= 2 && b.cls === 'SPACE_MAKER') add(100, 'They stacked pure snipers — space makers run them over');
                        if (ec['SPACE_MAKER'] && b.cls === 'ANTI_TANK') add(60, 'Survives their aggression and answers it');
                        if (b.cls === 'CONTROL') add(25, 'Flexible close-out pick');
                        if (b.cls === 'SNIPER') add(25, 'Flexible close-out pick');
                    }
                }

                // Mode affinity
                const modes = b.modes || CLASS_MODES[b.cls];
                if (modes.includes(g.id)) add(20, null); else { score -= 12; }

                // Map geometry weighting
                if (mapm.geo === 'OPEN') {
                    if (b.cls === 'SNIPER') add(14, 'Open map — range rules');
                    if (b.cls === 'THROWER' || b.cls === 'TANK') bad(-12, 'Open map punishes wall-dependent picks');
                } else if (mapm.geo === 'CLOSED' || mapm.geo === 'BUSHY') {
                    if (b.cls === 'SPACE_MAKER') add(10, mapm.geo === 'BUSHY' ? 'Bushy map — ambushers thrive' : 'Wall-heavy map — dive thrives');
                    if (b.cls === 'THROWER') add(8, 'Wall-heavy map: lobbed damage is stronger');
                    if (b.cls === 'SNIPER' && b.sub === 'PURE') bad(-10, 'Closed map starves pure snipers');
                }
                if (mapm.edge.includes(b.id)) add(20, `Classic strength on ${state.map}`);

                // Part 2: current-meta top picks get a flat push
                if (META5.has(b.id)) add(25, 'Current meta: top-5 pick in its class');

                // Direct counter pairs (this brawler beats locked enemies)
                enemies.forEach(e => {
                    if (b.counters && b.counters[e.id]) {
                        score += 18;
                        if (reasons.length < 4) reasons.push(`${b.name} — ${b.counters[e.id]}`);
                    }
                });
                // Mode-keyed counters (e.g. Chuck on Heist)
                if (b.counters && b.counters[g.id]) {
                    score += 18;
                    if (reasons.length < 4) reasons.push(`${b.counters[g.id]}`);
                }

                // Enemy counters this candidate
                enemies.forEach(e => {
                    if (e.counters && e.counters[b.id]) bad(-22, `${e.name} counters ${b.name}`);
                });

                // Class vulnerabilities from enemy composition
                if (b.cls === 'THROWER' && (ec['SPACE_MAKER'] || ec['TANK'])) bad(-40, 'Enemy mobility punishes throwers');
                if (b.cls === 'SNIPER' && b.sub === 'PURE' && ec['SPACE_MAKER']) bad(-45, 'Pure snipers get run down by space makers');

                // Supports need a damage partner
                if (b.cls === 'SUPPORT' && yours.length && !(yc['TANK'] || yc['ANTI_TANK'] || yc['SPACE_MAKER'] || yc['CONTROL'])) {
                    bad(-25, 'Support needs a damage/dealer partner on your team');
                }

                // SnakeThug x Bobby video: don't stack the same role (no 2nd anti-tank next to your Lou)
                const dup = (yc[b.cls] || 0);
                if (dup >= 2) bad(-18, `Team already has 2 ${CLASS_META[b.cls].label}s — stop stacking the same role`);
                else if (dup === 1 && (b.cls === 'ANTI_TANK' || b.cls === 'CONTROL' || b.cls === 'SUPPORT')) bad(-8, `Already have a ${CLASS_META[b.cls].label} — diversify roles`);

                // A 3rd sniper invites the enemy thrower counter-pick (they still have their 6th pick)
                if (band === '45' && b.cls === 'SNIPER' && (yc['SNIPER'] || 0) >= 2) bad(-25, 'A 3rd sniper invites the enemy thrower counter-pick');

                // Double-support heal comp handling (healers computed above)
                if (b.cls === 'THROWER' && healers >= 2) bad(-15, "Thrower can't close kills vs a double-support heal comp");

                // First pick should be a safe all-rounder — ban-aware: how many counters are still available?
                if (band === '1') {
                    const threats = BRAWLERS.filter(o => o.id !== b.id && o.counters && o.counters[b.id] && !taken.has(o.id)).length;
                    if (threats >= 5) bad(-10, `${threats} picks still counter it — risky first pick`);
                    else if (threats <= 1) add(11, 'Ban-freed pick: almost no counters remain — safe all-rounder opener');
                }

                recs.push({ brawler: b, score, reasons: reasons.filter(Boolean), warns });
            });

            recs.sort((a, b) => b.score - a.score);
            return { recs, aggro, band, enemies, yours, ec, yc, modeName: g.name, modeId: g.id };
        }

        function bandHint(aggro, band) {
            if (aggro) {
                if (band === '1') return 'First pick: best anti-tank';
                if (band === '23') return 'Secure anti-tank / punish';
                return 'Big picture: fill the gap';
            }
            if (band === '1') return 'Safe first pick (no throwers!)';
            if (band === '23') return 'Utility & hyper-impact';
            return 'Counter their blind spots';
        }

        function updateAdvice() {
            const { recs, aggro, band, enemies, yours, ec, yc, modeName, modeId } = recommend();

            document.getElementById('ruleHint').textContent = bandHint(aggro, band);

            const list = document.getElementById('recommendationsList');
            const top = recs.filter(r => r.score > 0).slice(0, 6);
            if (!top.length) {
                list.innerHTML = `<div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800 text-xs text-amber-300 font-semibold">❓ No strong data pick yet — scores update live as picks lock. Default: solid Control/Sniper for the mode (see grid).</div>`;
            } else {
                // Descending score display (Prodigy-style): best pick normalized to 99, bars sized proportionally. Tap a row to lock the pick.
                const best = top[0].score;
                list.innerHTML = top.map((rec, i) => {
                    const b = rec.brawler;
                    const mm = CLASS_META[b.cls];
                    const traits = (b.traits || []).map(t =>
                        `<span class="text-[8px] font-bold px-1 rounded" style="color:${TRAIT_META[t].hex}">${TRAIT_META[t].label}</span>`).join(' ');
                    const disp = Math.max(3, Math.min(99, Math.round(99 * rec.score / best)));
                    const warnHTML = rec.warns.length
                        ? `<div class="text-[9px] text-red-400 font-semibold mt-0.5 truncate">⚠️ ${rec.warns.slice(0, 2).join(' • ')}</div>` : '';
                    return `
                    <button onclick="pickBrawler('${b.id}')" class="w-full touch-btn text-left ${i === 0 ? 'glow-counter border-amber-400/80' : 'border-slate-800 hover:border-amber-400/40'} bg-slate-950 p-1.5 rounded-xl border flex items-center gap-2 shadow-lg">
                        <div class="relative shrink-0">
                            ${avatarHTML(b, 'w-10 h-10')}
                            <span class="absolute -top-1 -left-1 w-4 h-4 rounded-full bg-amber-400 text-slate-950 text-[9px] font-brawl flex items-center justify-center">${i + 1}</span>
                        </div>
                        <div class="min-w-0 flex-1">
                            <div class="flex items-center gap-1 flex-wrap mb-1">
                                <span class="font-brawl text-[11px] text-amber-400">${b.name}</span>
                                <span class="text-[8px] font-bold px-1 rounded" style="background:${mm.hex}22;color:${mm.hex}">${mm.label}</span>
                                ${BUFFIES.has(b.id) ? '<span class="text-[9px]" title="Buffie upgrades">🧪</span>' : ''}
                                ${traits}
                            </div>
                            <div class="relative h-5 rounded-md bg-slate-800 overflow-hidden">
                                <div class="absolute inset-y-0 left-0 rounded-md" style="width:${disp}%;background:linear-gradient(90deg,#92600a,#fbbf24)"></div>
                                <span class="absolute inset-0 flex items-center px-2 font-brawl text-[11px] ${disp >= 32 ? 'text-slate-950' : 'text-amber-200'} whitespace-nowrap">Score: ${disp}</span>
                            </div>
                            <div class="text-[9px] text-slate-200 font-semibold mt-1 truncate">${rec.reasons.slice(0, 2).join(' • ') || 'Solid situational pick'}</div>
                            ${warnHTML}
                        </div>
                    </button>`;
                }).join('');
            }

            // In Your Hand: what already counters each enemy pick
            const counterList = document.getElementById('counterList');
            if (!enemies.length) {
                counterList.innerHTML = `<div class="text-slate-500">Lock an enemy to see counters in hand.</div>`;
            } else {
                counterList.innerHTML = enemies.map(e => {
                    const inHand = yours.filter(y => y.counters && y.counters[e.id] && e.id);
                    if (inHand.length) {
                        return `<div>✅ <span class="text-green-400 font-bold">${inHand.map(y => y.name).join(', ')}</span> beat <span class="text-red-300">${e.name}</span></div>`;
                    }
                    return `<div>⚠️ <span class="text-slate-400">No dedicated counter yet for</span> <span class="text-red-300">${e.name}</span></div>`;
                }).join('');
            }

            // Watch Out: enemy brawlers that counter your locked picks
            const threatList = document.getElementById('threatList');
            if (!enemies.length || !yours.length) {
                threatList.innerHTML = `<div class="text-slate-500">Fill both sides to see threats.</div>`;
            } else {
                const notes = [];
                enemies.forEach(e => {
                    yours.forEach(y => {
                        if (e.counters && e.counters[y.id]) notes.push(`⚠️ <span class="text-red-300">${e.name}</span> terrorizes your <span class="text-green-300">${y.name}</span>: ${e.counters[y.id]}`);
                    });
                });
                threatList.innerHTML = notes.length ? notes.slice(0, 5).join('') : `<div class="text-slate-500">No direct threats found. ✅</div>`;
            }
        }

        function resetAll() {
            state.yourPicks = [null, null, null];
            state.enemyPicks = [null, null, null];
            state.target = 'you';
            state.focus = null;
            recompute();
        }
    </script>
</body>
</html>
